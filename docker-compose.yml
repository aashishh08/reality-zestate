version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reality_estate_db
    environment:
      POSTGRES_USER: reality_estate_user
      POSTGRES_PASSWORD: reality_estate_password
      POSTGRES_DB: reality_estate_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reality_estate_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reality_estate_api
    environment:
      NODE_ENV: production
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: reality_estate_user
      DB_PASSWORD: reality_estate_password
      DB_NAME: reality_estate_db
      JWT_SECRET: your_jwt_secret_key_here_change_in_production
      JWT_EXPIRE: 7d
      CRM_API_KEY: your_crm_api_key_here_change_in_production
      CORS_ORIGIN: https://superluxere.com
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    # NOTE: Do NOT volume-mount ./backend/src in production.
    # The image already contains the compiled src. Mounting would override it
    # and cause bootstrap.js / migration paths to break.
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://superluxere.com}
    container_name: reality_estate_web
    environment:
      NEXT_PUBLIC_API_URL: https://api.superluxere.com/api/v1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://superluxere.com}
      NODE_ENV: production
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    ports:
      - "3002:3002"
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge

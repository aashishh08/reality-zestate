version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reality_estate_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-reality_estate_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-reality_estate_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure:3
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - app_network

  backend:
    build: .
    container_name: reality_estate_api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-reality_estate_dev}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      CRM_API_KEY: ${CRM_API_KEY:-your_crm_api_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3002}
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
    # NOTE: No src volume mount — bootstrap.js and the migrations live inside the image.
    # Mounting src would override the container's code and break startup.
    restart: on-failure:5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
